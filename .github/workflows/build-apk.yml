name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write # sirf failure ka error-tail issue kholne ke liye (continue-on-error)

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7" # 2026-10-11 ko 'stable' ka HEAD — android/ scaffold isi ke template se hai
  CI_LOG: /tmp/jarvis-ci.log

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Toolchain info (repo structure check)
        run: |
          set -e
          {
            echo "## Build info"
            echo "- Flutter: \`$(flutter --version | head -1)\`"
            echo "- Dart: \`$(dart --version)\`"
            echo "- Java: \`$(java -version 2>&1 | head -1)\`"
            echo "- Commit: ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Repo me app source hona chahiye (CI ab app generate nahi karta).
          test -f pubspec.yaml || { echo "::error::pubspec.yaml missing — app source repo me hai hi nahi"; exit 1; }
          test -f lib/main.dart || { echo "::error::lib/main.dart missing"; exit 1; }
          test -f android/app/build.gradle.kts || { echo "::error::android scaffold missing"; exit 1; }
          flutter --version

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee -a "$CI_LOG"

      - name: Format check (warning-only until Phase 8)
        run: |
          dart format --output=none --set-exit-if-changed lib test \
            || echo "::warning::dart format ko changes chahiye — Phase 8 me isko blocking banayenge"

      - name: Analyze (blocking)
        run: flutter analyze 2>&1 | tee -a "$CI_LOG"

      - name: Unit tests (blocking)
        run: flutter test 2>&1 | tee -a "$CI_LOG"

      - name: Set up release signing (skipped when secrets absent)
        run: |
          set -e
          KS_B64="${{ secrets.JARVIS_KEYSTORE_BASE64 }}"
          if [ -z "$KS_B64" ]; then
            echo "RELEASE_SIGNING=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::JARVIS_KEYSTORE_BASE64 set nahi — APK debug key se sign hoga. Aise builds ek doosre ke UPAR install nahi honge (signature mismatch); uninstall karna padega."
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > android/app/jarvis-release.jks
          cat > android/key.properties <<PROPS
          storeFile=$GITHUB_WORKSPACE/android/app/jarvis-release.jks
          storePassword=${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.JARVIS_KEY_ALIAS }}
          keyPassword=${{ secrets.JARVIS_KEY_PASSWORD }}
          PROPS
          echo "RELEASE_SIGNING=custom-keystore" >> "$GITHUB_ENV"
          echo "Keystore: $(sha256sum android/app/jarvis-release.jks | cut -c1-16) (git me nahi gaya)"

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee -a "$CI_LOG"

      - name: Verify APK output + checksum
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            ls -R build/app/outputs || true
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cp "$APK" "jarvis-ai-agent-${{ env.FLUTTER_VERSION }}-${GITHUB_RUN_NUMBER}.apk"
          echo "$SHA  jarvis-ai-agent-${{ env.FLUTTER_VERSION }}-${GITHUB_RUN_NUMBER}.apk" > jarvis-apk-sha256.txt
          {
            echo ""
            echo "### Artifact"
            echo "- Signing: \`$RELEASE_SIGNING\`"
            echo "- Size: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
            echo "- SHA-256: \`$SHA\`"
            echo "- Install: ZIP nikaalo → APK → 'Unknown sources' allow → install"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK + checksum
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-ai-agent-apk
          path: |
            jarvis-ai-agent-*.apk
            jarvis-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report failure as an issue (mobile-friendly error reading)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAIL=$(tail -n 120 "$CI_LOG" 2>/dev/null || echo "log unavailable")
          SUMMARY="Build fail ho gaya on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`.

          \`\`\`
          $TAIL
          \`\`\`
          [Run log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI: APK build failed (${GITHUB_SHA::7})" \
            --body "$SUMMARY"
